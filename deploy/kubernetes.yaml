apiVersion: v1
kind: Namespace
metadata:
  name: monban-example
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monban
  namespace: monban-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monban
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
      labels:
        app: monban
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monban
          image: ghcr.io/soora-jp/monban:0.1.0
          args:
            - --max-connections=32
            - --tcp-buffer-size=262144
            - --max-header-bytes=16384
            - --connect-timeout=10s
            - --request-timeout=5m
            - --idle-timeout=60s
            - --tunnel-timeout=1h
            - --shutdown-delay=5s
            - --shutdown-timeout=10s
          env:
            - name: GOMEMLIMIT
              value: 64MiB
            - name: MONBAN_ALLOW
              value: api.wordpress.org:443,download.wordpress.org:443
          ports:
            - name: proxy
              containerPort: 8888
            - name: admin
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /livez
              port: admin
---
apiVersion: v1
kind: Service
metadata:
  name: monban
  namespace: monban-example
spec:
  selector:
    app: monban
  ports:
    - name: proxy
      port: 8888
      targetPort: proxy
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monban-example
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-egress
  namespace: monban-example
spec:
  podSelector:
    matchLabels:
      app: application
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: monban
      ports:
        - protocol: TCP
          port: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monban
  namespace: monban-example
spec:
  podSelector:
    matchLabels:
      app: monban
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: application
      ports:
        - protocol: TCP
          port: 8888
  egress:
    - {}

---
# Adjust these selectors to match your Prometheus installation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monban-metrics
  namespace: monban-example
spec:
  podSelector:
    matchLabels:
      app: monban
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
